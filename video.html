<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Curious Earth — Watch the Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;scroll-behavior:smooth}
a{color:inherit;text-decoration:none}
:root{--bg:#040D1E;--text:#EBEFF8;--text2:#7E8199;--accent:#015764;--border:rgba(235,239,248,.1);--side:clamp(20px,5vw,80px)}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 var(--side);height:60px;background:rgba(4,13,30,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.logo-name{font-family:'Fraunces',Georgia,serif;font-size:.9375rem;font-weight:400;color:var(--text)}
.back-link{font-size:.8125rem;color:var(--text2);display:flex;align-items:center;gap:6px;transition:color .2s}
.back-link:hover{color:var(--text)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px var(--side) 64px;gap:32px}
.eyebrow{font-size:.6875rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-bottom:10px;text-align:center}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.5rem,4vw,2.5rem);font-weight:300;color:var(--text);line-height:1.15;text-align:center}
h1 em{font-style:italic;color:rgba(235,239,248,.7)}
.video-wrap{width:100%;max-width:900px;border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 0 1px var(--border);position:relative;aspect-ratio:16/9;background:#000}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.foot-note{font-size:.8125rem;color:var(--text2);text-align:center}
.foot-note a{color:rgba(235,239,248,.55)}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/"><div class="logo-mark">CE</div><span class="logo-name">Curious Earth</span></a>
  <a class="back-link" href="/">← Back to site</a>
</nav>
<main>
  <div>
    <p class="eyebrow">Product Overview</p>
    <h1>See the world <em>differently</em></h1>
  </div>
  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/25PPAgHyARc?rel=0&modestbranding=1" title="Curious Earth" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  <p class="foot-note">Curious Earth ships in 2025. <a href="/#waitlist">Join the waitlist</a> to be first.</p>
</main>
</body>
</html>
